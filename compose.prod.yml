
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-runtime

    env_file:
      - .env

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/lib/laravel/database.sqlite
      XDG_CONFIG_HOME: /tmp

    volumes:
      - /srv/demo_iapel/data:/var/lib/laravel
      - /srv/demo_iapel/storage/app/public:/var/www/html/storage/app/public
      - /srv/demo_iapel/storage/app/signature:/var/www/html/storage/app/signature
      - /srv/demo_iapel/storage/framework:/var/www/html/storage/framework
      - /srv/demo_iapel/storage/logs:/var/www/html/storage/logs

    expose:
      - "9000"

    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-runtime

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - /srv/demo_iapel/storage/app/public:/var/www/html/storage/app/public:ro

    depends_on:
      - app

    restart: unless-stopped
