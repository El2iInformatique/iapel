
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-runtime

    env_file:
      - .env

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      XDG_CONFIG_HOME: /tmp

    volumes:
      - ./database:/var/www/html/database
      - ./storage/app/public:/var/www/html/storage/app/public
      - ./storage/app/signature:/var/www/html/storage/app/signature
      - laravel_cache:/var/www/html/bootstrap/cache
      - laravel_framework:/var/www/html/storage/framework
      - laravel_logs:/var/www/html/storage/logs

    expose:
      - "9000"

    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx-runtime

    ports:
      - "8000:80"

    volumes:
      - ./storage/app/public:/var/www/html/storage/app/public:ro

    depends_on:
      - app

    restart: unless-stopped

volumes:
  laravel_cache:
  laravel_framework:
  laravel_logs:
